packages:
  - packages/backend
  - packages/frontend-shared
  - packages/frontend
  - packages/frontend-builder
  - packages/frontend-embed
  - packages/icons-subsetter
  - packages/sw
  - packages/misskey-js
  - packages/misskey-js/generator
  - packages/misskey-reversi
  - packages/misskey-bubble-game
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@parcel/watcher'
  - '@sentry/profiling-node'
  - '@swc/core'
  - '@tensorflow/tfjs-node'
  - bufferutil
  - canvas
  - core-js
  - cypress
  - esbuild
  - msgpackr-extract
  - msw
  - nice-napi
  - re2
  - sharp
  - utf-8-validate
  - v-code-diff
  - vue-demi
ignorePatchFailures: false
minimumReleaseAge: 10080 # delay 7days to mitigate supply-chain attack
minimumReleaseAgeExclude:
  - '@syuilo/aiscript'
  - '@fastify/express'
  - 'pnpm@10.34.8' # security update reviewed 2026-10-25
  - 'nodemailer@10.1.4' # security update reviewed 2026-10-25
  - 'body-parser@1.20.9 || 2.4.0' # security update reviewed 2026-10-25
  - 'happy-dom@21.0.4' # security update reviewed 2026-10-25
  - 'multer@2.5.0' # security update reviewed 2026-10-25
  - 'fast-uri@3.1.9 || 4.2.3' # security update reviewed 2026-10-25
