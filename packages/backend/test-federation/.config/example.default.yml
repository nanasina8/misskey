url: https://${HOST}/
port: 3000
db:
  host: db.${HOST}
  port: 5432
  db: misskey
  user: postgres
  pass: postgres
dbReplications: false
redis:
  host: redis.test
  port: 6379
hanamiCursorSigningKeys:
  # Unsafe deterministic federation-test key. Do not reuse outside automated tests.
  - id: federation-unsafe-current
    secret: 'unsafe-federation-hanami-cursor-signing-secret-01'
# Hanami persisted timeline generation defaults.
hanamiGenerationSyncWaitMs: 2000
userHibernationDays: 50
hanamiCommonGenerationIntervalMs: 600000
hanamiGenerationWorkerTimeoutMs: 60000
hanamiGenerationLeaseMs: 75000
hanamiGenerationMaxAttempts: 3
hanamiGenerationReconcileIntervalMs: 5000
hanamiGenerationQueueConcurrency: 4
id: 'aidx'
proxyBypassHosts:
  - api.deepl.com
  - api-free.deepl.com
  - www.recaptcha.net
  - hcaptcha.com
  - challenges.cloudflare.com
allowedPrivateNetworks:
  - 127.0.0.1/32
  - 172.20.0.0/16
